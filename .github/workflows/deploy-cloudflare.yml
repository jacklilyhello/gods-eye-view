name: Deploy God's Eye View to Cloudflare

on:
  push:
    branches:
      - cf-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gods-eye-view-production
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/cf-production'
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate Cloudflare container image
        run: docker build -f Dockerfile.cloudflare -t gods-eye-view-test .

  deploy:
    if: github.ref == 'refs/heads/cf-production'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: .cloudflare/package-lock.json
      - run: npm ci
      - name: Deploy Worker and container
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
